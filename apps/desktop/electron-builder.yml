appId: com.solidprops.desktop
productName: SolidProps
copyright: Copyright © SolidProps
asar: true
directories:
  output: ../../artifacts/desktop
files:
  - out/**/*
  - package.json
  - resources/icons/*
extraResources:
  - from: ../../artifacts/worker/cad-worker
    to: cad-worker
win:
  icon: resources/icons/solidprops.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: SolidProps
  packElevateHelper: false
artifactName: SolidProps-Setup-${version}-${arch}.${ext}
