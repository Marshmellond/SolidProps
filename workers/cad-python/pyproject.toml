[project]
name = "cadweave-worker"
version = "0.1.0"
description = "Attach-only, safety-first SolidProps CAD stdio worker"
requires-python = ">=3.11"
dependencies = ["psutil>=6.1,<8", "pywin32>=308; sys_platform == 'win32'"]

[project.scripts]
cad-worker = "cad_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_worker"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pyinstaller>=6.11,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
